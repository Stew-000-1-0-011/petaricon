[package]
name = "app"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2"] }
slint-doc = { path = "../slint-doc" }
preview = { path = "../preview" }
tidy = { path = "../tidy" }
thiserror = "2"
storage = { path = "../storage" }

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["backend-winit", "renderer-femtovg"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["backend-android-activity-06"] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
tempfile = "3"

[package.metadata.android]
package = "dev.petaricon.editor"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.signing.release]
path = "/root/.android/debug.keystore"
keystore_password = "android"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "Petaricon Editor"

[package.metadata.android.application.activity]
orientation = "unspecified"
