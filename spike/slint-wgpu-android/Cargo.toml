[package]
name = "pointcloud_spike"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "unstable-wgpu-30", "renderer-femtovg-wgpu", "backend-winit"] }
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
# Only to enable WGSL shader support in the wgpu that Slint already depends on.
wgpu = { version = "30", default-features = false, features = ["wgsl"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["backend-android-activity-06"] }

[build-dependencies]
slint-build = "=1.18.1"

[package.metadata.android]
package = "dev.petaricon.pointcloud_spike"
build_targets = ["aarch64-linux-android"]
# Release builds are signed with the debug keystore; this is a throwaway spike.
[package.metadata.android.signing.release]
path = "/root/.android/debug.keystore"
keystore_password = "android"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "PointCloud Spike"

[package.metadata.android.application.activity]
orientation = "portrait"

[profile.release]
debug = false
strip = true
