[package]
name = "interp_editor_spike"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2"] }
slint-interpreter = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "internal", "internal-highlight"] }
i-slint-compiler = { version = "=1.18.1", default-features = false }
spin_on = "0.1"
i-slint-core = { version = "=1.18.1", default-features = false }

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["backend-winit", "renderer-femtovg"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["backend-android-activity-06"] }

[build-dependencies]
slint-build = "=1.18.1"

[package.metadata.android]
package = "dev.petaricon.interp_editor_spike"
build_targets = ["aarch64-linux-android"]
# Release builds are signed with the debug keystore; this is a throwaway spike.
[package.metadata.android.signing.release]
path = "/root/.android/debug.keystore"
keystore_password = "android"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "Interp Editor Spike"

[package.metadata.android.application.activity]
orientation = "portrait"

[profile.release]
debug = false
strip = true
